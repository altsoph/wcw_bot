services:
  wcw_bot:
    image: wcw_bot
    build: .
    ports:
      - 3000:3000
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
      - type: bind
        source: ./secrets.yaml
        target: /app/secrets.yaml
        read_only: true
      - type: bind
        source: ./dbg_detected
        target: /app/dbg_detected
