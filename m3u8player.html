<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HLS capture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
  <!-- hls.js 1.6.19, Apache-2.0; see HLS_JS_LICENSE.txt. -->
  <script src="hls.min.js"></script>
</head>
<body>
  <video id="video" muted autoplay playsinline></video>
  <script>
    const video = document.getElementById('video');
    const source = new URLSearchParams(location.search).get('c');
    if (source && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(source);
      hls.attachMedia(video);
      hls.on(Hls.Events.MEDIA_ATTACHED, () => video.play());
    } else if (source && video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = source;
      video.play();
    }
  </script>
</body>
</html>
